name: Deploy to GitHub Pages

# 纯静态站点，零构建：src/ 就是产物根目录，直接交给 upload-pages-artifact。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
